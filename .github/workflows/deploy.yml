name: Deploy to JustRunMy.App

on:
  push:
    branches:
      - main # Automatically deploys when you push commits to the main branch
  workflow_dispatch: # Enables manual execution button in the GitHub Actions dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to JRMA Production Deploy Branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # Executes your exact upstream push command using the stored secret URL
          git push -u "${{ secrets.JRMA_DEPLOY_URL }}" HEAD:deploy