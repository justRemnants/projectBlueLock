name: Deploy to JustRunMy.App

on:
  push:
    branches:
      - main # Automatically deploys when you push commits to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to JRMA Production Deploy Branch
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # Directly pushes HEAD to your deploy branch using your single secret URL
          git push --force "${{ secrets.JRMA_DEPLOY_URL }}" HEAD:deploy